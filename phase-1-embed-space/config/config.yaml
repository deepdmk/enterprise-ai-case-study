# Phase 1: Unified Embedding Space Configuration
# ==============================================
# This config uses a placeholder pattern for unknown PostgreSQL schemas.
# Update the database table configurations when actual schemas are known.

app:
  name: "enterprise-embedding-space"
  version: "1.0.0"
  log_level: "INFO"
  log_dir: "data/logs"

# Source Database Configurations
# ------------------------------
# PLACEHOLDER PATTERN: Define tables by their column roles, not specific names.
# When actual schemas are known, update text_columns, id_column, etc.
databases:
  database_1:
    host: "${DB1_HOST:-localhost}"
    port: "${DB1_PORT:-5432}"
    name: "${DB1_NAME:-enterprise_db1}"
    user: "${DB1_USER:-postgres}"
    password: "${DB1_PASSWORD:-}"
    pool_size: 5
    # Table configurations - UPDATE WHEN SCHEMA IS KNOWN
    tables:
      - name: "documents"
        text_columns: ["content", "title", "summary"]
        id_column: "id"
        timestamp_column: "updated_at"
        additional_metadata: ["category", "author", "created_at"]
      - name: "notes"
        text_columns: ["body"]
        id_column: "note_id"
        timestamp_column: "modified_date"
        additional_metadata: ["user_id", "tags"]

  database_2:
    host: "${DB2_HOST:-localhost}"
    port: "${DB2_PORT:-5432}"
    name: "${DB2_NAME:-enterprise_db2}"
    user: "${DB2_USER:-postgres}"
    password: "${DB2_PASSWORD:-}"
    pool_size: 5
    tables:
      - name: "reports"
        text_columns: ["report_content", "executive_summary"]
        id_column: "report_id"
        timestamp_column: "last_updated"
        additional_metadata: ["department", "fiscal_year"]

  database_3:
    host: "${DB3_HOST:-localhost}"
    port: "${DB3_PORT:-5432}"
    name: "${DB3_NAME:-enterprise_db3}"
    user: "${DB3_USER:-postgres}"
    password: "${DB3_PASSWORD:-}"
    pool_size: 5
    tables:
      - name: "articles"
        text_columns: ["content"]
        id_column: "article_id"
        timestamp_column: "published_at"
        additional_metadata: ["author", "category", "tags"]

# ChromaDB Configuration
# ----------------------
chromadb:
  host: "${CHROMADB_HOST:-localhost}"
  port: "${CHROMADB_PORT:-8000}"
  collection_name: "enterprise_embeddings"
  # HNSW index configuration
  hnsw:
    space: "cosine"
    ef_construction: 200
    ef_search: 40

# Embedding Model Configuration
# -----------------------------
embedding:
  base_model: "sentence-transformers/all-MiniLM-L6-v2"
  fine_tuned_model_path: "data/models/enterprise-embed-v1"
  embedding_dimension: 384
  batch_size: 32
  device: "auto"  # auto, cuda, cpu, mps

# Program 1: Dataset Generator Configuration
# ------------------------------------------
dataset_generator:
  output_dir: "data/training_datasets"
  samples_per_table: 10000
  pair_generation:
    strategy: "adjacent_chunks"  # adjacent_chunks, title_content
    min_chunk_length: 50
  chunking:
    chunk_size: 512
    chunk_overlap: 50
  train_val_split: 0.9
  random_seed: 42

# Program 2: Fine-Tuning Configuration
# ------------------------------------
fine_tuning:
  output_dir: "data/models"
  model_name: "enterprise-embed-v1"
  training:
    epochs: 3
    batch_size: 64
    learning_rate: 2.0e-5
    warmup_ratio: 0.1
    fp16: true
    save_strategy: "epoch"
    logging_steps: 100
    evaluation_strategy: "steps"
    eval_steps: 500
  loss:
    type: "MultipleNegativesRankingLoss"
    scale: 20.0

# Program 3: Ingestion Pipeline Configuration
# -------------------------------------------
ingestion:
  chunking:
    chunk_size: 512
    chunk_overlap: 50
    strategy: "recursive"  # recursive, sentence, fixed
  batch_size: 100
  incremental:
    enabled: true
    state_file: "data/sync_state.json"

# Program 4: Search Configuration
# -------------------------------
search:
  default_k: 5
  max_k: 20
  reranking:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    candidate_multiplier: 3
  feedback:
    enabled: true
    feedback_dir: "data/feedback"
  gradio:
    host: "0.0.0.0"
    port: 7860
    share: false
    title: "Enterprise Document Search"
    description: "Semantic search across unified enterprise data"
