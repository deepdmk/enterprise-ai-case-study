[pytest]
# Pytest configuration for phase-0-infrastructure

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Markers (for test categorization)
markers =
    unit: Unit tests for individual components
    integration: Integration tests for cross-component workflows
    slow: Tests that take longer to run

# Logging
log_cli = false
log_cli_level = INFO

# Coverage (if pytest-cov is installed)
# addopts = --cov=registries --cov-report=html --cov-report=term
