agent:
  description: A2A agent powered by business_development MoE with 2 experts
  id: business_development_agent
  name: Competitive Funders Agent
model:
  architecture: mixtral
  experts:
  - expert_id: 0
    positive_prompts:
    - Analyze this RFP
    - Review funding requirements
    task_id: rfp_analysis
  - expert_id: 1
    positive_prompts:
    - Analyze competitive landscape
    - Review competitor activity
    task_id: competitive_landscape
  experts_per_token: 2
  num_experts: 2
  path: ./model
  type: moe
routing:
  embedding_model: BAAI/bge-base-en-v1.5
  gate_mode: hidden
  method: semantic
tasks:
- rfp_analysis
- competitive_landscape
