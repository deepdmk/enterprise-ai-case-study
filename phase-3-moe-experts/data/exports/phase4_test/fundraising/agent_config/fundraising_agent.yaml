agent:
  description: A2A agent powered by fundraising MoE with 2 experts
  id: fundraising_agent
  name: Angel Investors Agent
model:
  architecture: mixtral
  experts:
  - expert_id: 0
    positive_prompts:
    - Profile this investor
    - Create investor profile
    - Analyze investor background
    task_id: investor_profiling
  - expert_id: 1
    positive_prompts:
    - Evaluate funding opportunity
    - Assess investment potential
    task_id: funding_opportunity
  experts_per_token: 2
  num_experts: 2
  path: ./model
  type: moe
routing:
  embedding_model: BAAI/bge-base-en-v1.5
  gate_mode: hidden
  method: semantic
tasks:
- investor_profiling
- funding_opportunity
