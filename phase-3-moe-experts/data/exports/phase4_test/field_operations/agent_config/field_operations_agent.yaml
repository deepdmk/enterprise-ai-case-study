agent:
  description: A2A agent powered by field_operations MoE with 2 experts
  id: field_operations_agent
  name: Country Office Agent
model:
  architecture: mixtral
  experts:
  - expert_id: 0
    positive_prompts:
    - Analyze market conditions
    - Assess local market
    task_id: market_intelligence
  - expert_id: 1
    positive_prompts:
    - Evaluate project performance
    - Assess project outcomes
    task_id: project_performance
  experts_per_token: 2
  num_experts: 2
  path: ./model
  type: moe
routing:
  embedding_model: BAAI/bge-base-en-v1.5
  gate_mode: hidden
  method: semantic
tasks:
- market_intelligence
- project_performance
