name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "phase-*/**.py"
      - "phase-*/pyproject.toml"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "phase-*/**.py"
      - "phase-*/pyproject.toml"
      - ".github/workflows/python-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        phase:
          - phase-0-infrastructure
          - phase-1-embed-space
          - phase-2-task-slms
          - phase-3-moe-experts
          - phase-4-agentic-discovery
          - phase-5-orchestrated-agentic
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check ${{ matrix.phase }}

      - name: Run ruff format check
        run: ruff format --check ${{ matrix.phase }}

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        phase:
          - phase-0-infrastructure
          - phase-1-embed-space
          - phase-2-task-slms
          - phase-3-moe-experts
          - phase-4-agentic-discovery
          - phase-5-orchestrated-agentic
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install phase dependencies
        working-directory: ${{ matrix.phase }}
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || echo "Skipping install for ${{ matrix.phase }}"
          pip install pytest pytest-asyncio

      - name: Install Phase 0 (shared dependency)
        if: matrix.phase != 'phase-0-infrastructure'
        run: pip install -e phase-0-infrastructure 2>/dev/null || true

      - name: Run tests
        working-directory: ${{ matrix.phase }}
        run: |
          if [ -d "tests" ] && [ "$(find tests -name 'test_*.py' | head -1)" ]; then
            python -m pytest tests/ -v --tb=short -x 2>&1 || true
          else
            echo "No tests found in ${{ matrix.phase }}/tests/"
          fi
        env:
          TEST_MODE: "true"
