[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phase5-orchestrated-agentic"
version = "0.1.0"
description = "SLM-based orchestrator fine-tuned on Phase 4 A2A discovery logs"
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "trl>=0.8.0",
    "datasets>=2.18.0",
    "bitsandbytes>=0.41.0",

    # Inference
    "vllm>=0.3.0",

    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Agno Framework (Multi-Agent Orchestration)
    "agno>=2.4.0",

    # Configuration
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",

    # Utilities
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.282",
    "mypy>=1.4.1",
]

[project.scripts]
phase5-convert = "program1_data_conversion.main:main"
phase5-finetune = "program2_slm_finetuning.main:main"
phase5-inference = "program3_inference_server.main:main"
phase5-orchestrator = "program4_orchestrator_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
